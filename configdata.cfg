# -------------
# Runtime configuration
# -------------

QUERY:
    FB:     MyFritzbox
    AINS:   ALL
#    AINS:    ["116300126364", "116300176719"]
    looptime: 30        # seconds between query cycles (change requires restart)

MQTT:
    broker:     RASPI             # entry under MQTT_BROKER in secrets.yaml to use
    maintoken:  "sensor/FB"        # state data is published below this: sensor/FB/<FB>/<AIN>
    cmdtoken:   "cmd/FB"           # switch commands are received here:     cmd/FB/<FB>/#
    clientId:   "FritzDectMQTT"
    qos:        0                  # QoS for published state (0/1/2)
    retain:     true               # retain published state (Moonraker/Mainsail get the last value immediately)

# -------------
# log configuration
# -------------
logging:
    version: 1
    disable_existing_loggers: True
    formatters:
        simple:
            format: "%(name)s - %(lineno)d -  %(message)s"
        complex:
            format: "%(asctime)s - %(name)s - %(lineno)d -  %(message)s"
        default:
            format: '%(asctime)s %(levelname)-8s %(name)-10s %(lineno)-4d : %(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S'

    handlers:
        # Log to stdout; inside a container Docker (json-file) handles rotation.
        console:
            class: logging.StreamHandler
            level: DEBUG
            formatter: default

# Level shows: INFO | WARNING | DEBUG | ERROR
#   INFO    :     x       x                x
#   WARNING :             x                x
#   DEBUG   :     x       x        x       x
#   ERROR   :                              x

    loggers:
        __main__:
            level: INFO
            handlers: [console]
            propagate: yes

        MQTT:
            level: INFO
            handlers: [console]
            propagate: yes
