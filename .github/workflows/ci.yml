name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest
      - name: Ruff
        run: ruff check .
      - name: Byte-compile
        run: python -m py_compile FritzDect2MQTT.py MQTT.py
      - name: Tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -f docker/Dockerfile -t fritzdect2mqtt:ci .
      - name: Smoke-test image
        run: docker run --rm fritzdect2mqtt:ci python -c "import MQTT, fritzconnection, paho.mqtt; print('ok')"
